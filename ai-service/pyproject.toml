[project]
name = "sports-takeout-ai"
version = "0.1.0"
description = "体育外卖 · AI 微服务：教练智能推荐 / 评价摘要 / 证书审核（LangGraph + LiteLLM + Pydantic）"
requires-python = ">=3.11"
dependencies = [
    # —— 核心框架：版本严格锁定，避免漂移（参考经验 1674242 / 100007543）——
    # 注：add_messages reducer 与 BaseMessage 已整合进 langchain-core，无需额外 langchain-messages
    "langgraph==1.1.4",          # LangGraph 1.x GA，StateGraph + add_messages 语义稳定
    "langchain-core>=1.0",       # 只用到消息对象与 add_messages reducer；须 >=1.0 对齐 langgraph-prebuilt
    # —— LLM：通过 LiteLLM 统一路由 DeepSeek / 通义 / OpenAI（参考经验 100007545）——
    "litellm==1.55.3",           # 多模型统一接口（OpenAI 兼容模式）
    # —— 结构化输出 + 适配层（参考经验 100036121：LLM 漂移前做归一化）——
    "pydantic==2.10.4",
    "pydantic-settings==2.6.1",
    # —— 服务层 ——
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "httpx==0.27.2",             # HTTP 调现有 Spring Boot（如果需要远程查教练库）
    # —— 数据库：只读现有 sports_takeout MySQL ——
    "sqlalchemy==2.0.36",
    "pymysql==1.1.1",
    # —— Redis：缓存 / 限流 / Token 预算 / Checkpointer（生产）——
    "redis==7.4.1",                 # langgraph-checkpoint-redis 0.5.2 要求 redis<8.0
    "langgraph-checkpoint-redis==0.5.2",  # RedisSaver（生产 Checkpointer，多副本共享 + 崩溃恢复）
    # —— 工具 ——
    "python-dotenv==1.0.1",
    # —— 混合检索（#04，轻量降级方案：BM25 纯 Python 离线可跑；向量/重排重依赖暂不引入）——
    "rank-bm25==0.2.2",            # BM25 稀疏召回
    "jieba==0.42.1",               # 中文分词（BM25 建索引/查询用）
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "rich==13.9.4",
]
# 向量召回依赖（三选一，按选的后端装）：
#   chroma 模式      → pip install -e ".[vector-chroma]"
#   chroma_http 模式 → pip install -e ".[vector-chroma]"（同包，HttpClient 内置）
#   pgvector 模式    → pip install -e ".[vector-pgvector]"
# 两个都装也行（通过 VECTOR_DB_BACKEND 配置切换）：
#   pip install -e ".[vector-all]"
vector-chroma = [
    "chromadb>=0.5.0",            # Chroma 向量库（PersistentClient + HttpClient）
]
vector-pgvector = [
    "psycopg2-binary>=2.9.9",     # PostgreSQL 驱动（pgvector 后端）
]
vector-all = [
    "chromadb>=0.5.0",
    "psycopg2-binary>=2.9.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.yaml"]
