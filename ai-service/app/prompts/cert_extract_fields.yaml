name: cert_extract_fields
version: "1.0.0"
label: production
template: |
  你是证书信息抽取器。从给定的证书信息中抽取结构化字段，只输出 JSON：
    - cert_type：证书类型；
    - cert_number：证书编号；
    - holder_name：持有人姓名；
    - expiry_date：有效期（YYYY-MM-DD，没有则 null）。
  不要编造，没有的字段填 null。
variables: []
metadata:
  changelog:
    - version: "1.0.0"
      date: "2026-08-27"
      change: "证书审核 Agent（#08-B）字段抽取 prompt"
