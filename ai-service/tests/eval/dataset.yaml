# 教练推荐 Eval 标注数据集（#06 Harness 工程）
# 字段：
#   - query: 用户自然语言
#   - expected_intent: 期望意图（只标关注的字段，None 的字段不参与打分）
#   - expected_coach_ids_subset: 期望 Top-K 中至少包含的 coach_id 之一
#   - tags: 分类标签（happy_path / 边界 / 兜底）
#
# 说明：mock 模式（AI_MOCK=1）下 intent 由关键词规则抽取，expected_intent 与规则对齐；
#       真实 LLM 模式下 expected_intent 才是真正的「标注 ground truth」，可据此评估 LLM。

- id: eval_001
  name: 产后恢复+预算+时段
  query: "我家住望京，预算 200 以内，想产后恢复，最好周末上午"
  expected_intent:
    city_name: "北京市"
    district: "望京"
    specialization: "产后恢复"
    max_price: 200
    time_slot: "周末"
  expected_coach_ids_subset: [3]
  tags: [happy_path, 产后]

- id: eval_002
  name: 减脂+金牌教练
  query: "想找金牌教练上门减脂塑形，要求评分高，在北京朝阳区"
  expected_intent:
    level: 4
    specialization: "减脂塑形"
    city_name: "北京市"
    district: "朝阳区"
  expected_coach_ids_subset: [1]
  tags: [happy_path, 减脂]

- id: eval_003
  name: 增肌+便宜优先
  query: "男生想增肌，预算有限，150块钱一次以内，工作日晚上有时间"
  expected_intent:
    specialization: "增肌训练"
    max_price: 150
    time_slot: "工作日晚上"
  expected_coach_ids_subset: [2]
  tags: [happy_path, 增肌]

