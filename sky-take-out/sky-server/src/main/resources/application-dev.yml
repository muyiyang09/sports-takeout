sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: sports_takeout
    username: root
    password: 123456
  # 以下第三方密钥均为占位符，请替换为你自己的值，切勿提交真实密钥到仓库
  alioss:
    access-key-id: your-aliyun-access-key-id
    access-key-secret: your-aliyun-access-key-secret
    endpoint: oss-cn-beijing.aliyuncs.com
    bucket-name: your-oss-bucket
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0
  wechat:
    appid: your-wx-appid
    secret: your-wx-secret
    mchid: your-wx-mchid
    mchSerialNo: your-wx-mch-serial-no
    privateKeyFilePath: /path/to/apiclient_key.pem
    apiV3Key: your-wx-api-v3-key
    weChatPayCertFilePath: /path/to/wechatpay.pem
    notifyUrl: http://localhost:8080/notify/paySuccess
    refundNotifyUrl: http://localhost:8080/notify/refundSuccess
  shop:
    address: 北京市朝阳区北苑东路11号院
  baidu:
    ak: your-baidu-ak
