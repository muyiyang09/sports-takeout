sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${SKY_DATASOURCE_HOST:mysql}
    port: ${SKY_DATASOURCE_PORT:3306}
    database: ${SKY_DATASOURCE_DATABASE:sports_takeout}
    username: ${SKY_DATASOURCE_USERNAME:root}
    password: ${SKY_DATASOURCE_PASSWORD:123456}
  # JWT/AES 密钥：生产必须通过 .env 注入，缺失即启动失败（§6.14）
  jwt:
    admin-secret-key: ${SKY_JWT_ADMIN_KEY:}
    user-secret-key: ${SKY_JWT_USER_KEY:}
    coach-secret-key: ${SKY_JWT_COACH_KEY:}
  encrypt:
    aes-key: ${SKY_AES_KEY:}
  alioss:
    access-key-id: ${SKY_OSS_AK:}
    access-key-secret: ${SKY_OSS_SK:}
    endpoint: ${SKY_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket-name: ${SKY_OSS_BUCKET:}
  redis:
    host: ${SKY_REDIS_HOST:redis}
    port: ${SKY_REDIS_PORT:6379}
    password: ${SKY_REDIS_PASSWORD:}
    database: 0
  wechat:
    appid: ${SKY_WX_APPID:}
    secret: ${SKY_WX_SECRET:}
    mchid: ${SKY_WX_MCHID:}
    mchSerialNo: ${SKY_WX_MCH_SERIAL:}
    privateKeyFilePath: ${SKY_WX_PRIVATE_KEY_PATH:/app/pay/apiclient_key.pem}
    apiV3Key: ${SKY_WX_API_V3_KEY:}
    weChatPayCertFilePath: ${SKY_WX_PAY_CERT_PATH:/app/pay/wechatpay.pem}
    notifyUrl: ${SKY_WX_NOTIFY_URL:http://localhost:8080/notify/paySuccess}
    refundNotifyUrl: ${SKY_WX_REFUND_NOTIFY_URL:http://localhost:8080/notify/refundSuccess}
  shop:
    address: ${SKY_SHOP_ADDRESS:北京市朝阳区北苑东路11号院}
  baidu:
    ak: ${SKY_BAIDU_AK:}
  ai:
    base-url: ${SKY_AI_BASE_URL:http://ai-service:18000}
    service-token: ${SKY_AI_SERVICE_TOKEN:}
