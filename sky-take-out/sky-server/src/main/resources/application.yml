server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    password: ${sky.redis.password}
    database: ${sky.redis.database} #默认数据库是0，可不配置
    # === 无 Redis 环境降级配置（本机未安装 Redis 时，不阻塞 Spring Boot 启动） ===
    # - 启动时不校验连接池可用性；所有 redis 操作由业务层 try/catch 并降级
    # - Lettuce 关闭重试/缩短超时，避免每次读 DB 前在 Redis 上等很久
    lettuce:
      pool:
        enabled: false          # 不用共享连接池（无 Redis 时更快失败）
      shutdown-timeout: 50ms
    connect-timeout: 150ms     # TCP 建连超时（127.0.0.1 上 Redis 没启动的话 150ms 就失败）
    timeout: 150ms             # 读超时

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: itheima
    user-ttl: 7200000
    user-token-name: authentication
    # 教练端
    coach-secret-key: itcast
    coach-ttl: 7200000
    coach-token-name: token
  encrypt:
    # 敏感信息(身份证号等)AES 加密密钥(16/24/32 字节)
    aes-key: SportsTakeoutKey
  alioss:
    endpoint: ${sky.alioss.endpoint}
    access-key-id: ${sky.alioss.access-key-id}
    access-key-secret: ${sky.alioss.access-key-secret}
    bucket-name: ${sky.alioss.bucket-name}
    # 设置上传文件大小限制
    max-size: 10485760
  wechat:
    appid: ${sky.wx.app-id}
    secret: ${sky.wx.app-secret}
    mchid: ${sky.wx.mch-id}
    mchSerialNo: ${sky.wx.mcg-serial-no}
    privateKeyFilePath: ${sky.wx.private-key-path}
    apiV3Key: ${sky.wx.api-v3-key}
    weChatPayCertFilePath: ${sky.wx.wechat-pay-cert-path}
    notifyUrl: ${sky.wx.notify-url}
    refundNotifyUrl: ${sky.wx.refund-notify-url}
  shop:
    address: ${sky.shop.address}
  baidu:
    ak: ${sky.baidu.ak}

